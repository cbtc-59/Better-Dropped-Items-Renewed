plugins {
    id 'java'
    id 'maven-publish'
    id 'fabric-loom' version '1.7.+'
}

group = 'io.github.cbtc_59'
version = "${mod_version}"

sourceCompatibility = 21
targetCompatibility = 21

repositories {
    mavenCentral()
    maven {
        url 'https://maven.fabricmc.net/'
    }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://maven.shedaniel.me/" }
}

dependencies {
    minecraft "com.mojang:minecraft:1.21"
    mappings "net.fabricmc:yarn:1.21+build.2:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    
    // Fabric API - 提供必要的Fabric模块
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.100.1+1.21"
    
    modImplementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.release = 21
}

jar {
    archiveBaseName = "better-dropped-items-renewed"
    archiveVersion = "${mod_version}-1.21"
}